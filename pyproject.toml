[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "_blender_application.test_settings"
pythonpath = ["backend"]
testpaths = ["backend/core/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
